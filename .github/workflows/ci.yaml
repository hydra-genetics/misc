name: CI

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "workflow/**"
      - ".tests/**"
      - "requirements.txt"
      - "requirements.test.txt"
      - ".github/workflows/ci.yaml"
      - ".pre-commit-config.yaml"
      - "config/**"
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "workflow/**"
      - ".tests/**"
      - "requirements.txt"
      - "requirements.test.txt"
      - ".github/workflows/ci.yaml"
      - ".pre-commit-config.yaml"
      - "config/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1 - fast checks run in parallel
  lint:
    name: Lint workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Linting
        working-directory: .tests/integration
        run: snakemake --lint -n -s ../../workflow/Snakefile --configfile config.yaml

  snakefmt:
    name: Snakefmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.test.txt
      - name: Install dependencies
        run: pip install -r requirements.test.txt
      - name: Snakefmt check
        run: snakefmt --check --config .github/linters/.snakefmt.toml workflow/

  # Stage 2 - dry run after stage 1 passes
  dry-run:
    name: Snakemake dry run
    needs: [lint, snakefmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Snakemake dry run
        working-directory: .tests/integration
        run: snakemake -n -s ../../workflow/Snakefile --configfile config.yaml

  # Stage 3 - full integration test, push only
  integration:
    name: Integration test
    needs: [dry-run]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache Apptainer images
        id: cache-apptainer
        uses: actions/cache@v4
        with:
          path: ~/apptainer_containers
          key: ${{ runner.os }}-apptainer-${{ hashFiles('config/**/*.yaml', '.tests/integration/*.yaml', 'workflow/Snakefile') }}
          restore-keys: |
            ${{ runner.os }}-apptainer
      - name: Integration test - small dataset
        working-directory: .tests/integration
        run: |
          mkdir -p ~/apptainer_containers &&
          snakemake -s ../../workflow/Snakefile -j 4 --show-failed-logs --configfile config.yaml --software-deployment-method apptainer --apptainer-args " --cleanenv --bind /home/runner " --apptainer-prefix ~/apptainer_containers/
